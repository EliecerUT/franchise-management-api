# Compila y ejecuta todos los tests en cada Pull Request y en cada cambio de develop o main.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Si llega un commit nuevo al mismo PR, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Compilar y testear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # El runner trae Docker, así que los tests con Testcontainers (MongoDB) también se ejecutan
      - name: Tests
        run: ./mvnw -B verify

      - name: Publicar los reportes de tests si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    name: Construir la imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t franchise-management-api:ci .
