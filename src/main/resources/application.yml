spring:
  application:
    name: franchises-api
  mongodb:
    # Se puede sobrescribir con la variable de entorno MONGODB_URI (p. ej. un cluster en la nube)
    uri: ${MONGODB_URI:mongodb://localhost:27017/franchises}
  data:
    mongodb:
      # Crea al arrancar los índices declarados con @Indexed (nombre y NIT de franquicia únicos)
      auto-index-creation: true
      representation:
        # Guarda los BigDecimal (precios) como Decimal128 y no como texto
        big-decimal: decimal128

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
